# WARNING: Copy .env.docker to .env and update with your actual values before running.
# DO NOT use default/example values in production!

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: bitwebapp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=bitwebapp
    networks:
      - bitwebapp-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js app: frontend + API + Socket.IO + cron jobs
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: bitwebapp-app
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bitwebapp-network
    volumes:
      - uploads_data:/app/public/uploads

volumes:
  mongodb_data:
  uploads_data:

networks:
  bitwebapp-network:
    driver: bridge
